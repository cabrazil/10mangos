# =============================================================================
#  10mangos — PostgreSQL dedicado
#  Servidor: br-vmoracle (Ubuntu 24.04 arm64) — postgres:17-alpine tem imagem arm64
#
#  Porta 5432 já usada por creditcard_postgres -> usamos 5433 no host.
#  Por segurança a porta é publicada apenas em 127.0.0.1 (acesso via túnel SSH).
#  Veja docker/README.md.
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: 10mangos_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Ajustes para uma VM de 24 GB compartilhada com outros serviços
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=America/Sao_Paulo
    shm_size: 1gb
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: 10mangos_pgdata
